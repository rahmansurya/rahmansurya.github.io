<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>root@vir0e5</title>

<style>
body {
    margin:0;
    background:black;
    color:#00ff41;
    font-family:"Courier New", monospace;
    overflow:hidden;
}

/* CRT EFFECT */
body::after {
    content:"";
    position:fixed;
    top:0; left:0;
    width:100%; height:100%;
    background:repeating-linear-gradient(
        0deg,
        rgba(0,255,0,0.05),
        rgba(0,255,0,0.05) 1px,
        transparent 1px,
        transparent 2px
    );
    pointer-events:none;
}

/* TERMINAL */
#terminal {
    padding:20px;
    height:100vh;
    overflow-y:auto;
    white-space:pre-wrap;
}

/* INPUT */
.input-line {
    display:flex;
}
.prompt {
    color:#00ff41;
    margin-right:5px;
}
input {
    background:none;
    border:none;
    outline:none;
    color:#00ff41;
    width:100%;
    font-family:inherit;
}

/* BLINK */
.cursor {
    animation:blink 1s infinite;
}
@keyframes blink {
    50% {opacity:0;}
}
</style>
</head>

<body>

<div id="terminal"></div>

<script src="script.js"></script>
</body>
</html>
